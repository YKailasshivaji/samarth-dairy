name: Build APK
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=android --org in.samarthdairy --project-name samarth_dairy .
      - name: Android permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n<queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="upi"/></intent><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n<application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=OWNER_UPI=${{ secrets.OWNER_UPI }}
      - uses: actions/upload-artifact@v4
        with: { name: samarth-dairy-apk, path: build/app/outputs/flutter-apk/app-release.apk }

